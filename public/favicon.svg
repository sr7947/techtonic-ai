<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1124" />
      <stop offset="50%" stop-color="#050814" />
      <stop offset="100%" stop-color="#0F1B38" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B3" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#BD9A76" />
      <stop offset="100%" stop-color="#8C6839" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Subtle Lab Grid Accent -->
  <path d="M4 50 H96 M50 4 V96" stroke="#D4AF37" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Futuristic "W" Monogram -->
  <g filter="url(#goldGlow)">
    <path d="M22 28 L35 72 L44 48 L37 28 L28 28 Z" fill="url(#goldGrad)" />
    <path d="M44 48 L50 34 L56 48 L50 62 Z" fill="url(#glowGrad)" />
    <path d="M78 28 L65 72 L56 48 L63 28 L72 28 Z" fill="url(#goldGrad)" />
    <circle cx="50" cy="34" r="3.5" fill="#FFFFFF" />
    <circle cx="50" cy="34" r="7" stroke="#FFE8B3" stroke-width="1.2" stroke-opacity="0.7" />
    <path d="M29 42 H40 M60 42 H71" stroke="#FFE8B3" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  </g>
</svg>
